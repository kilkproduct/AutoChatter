name: Deploy AutoChatter Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/prepare_pages.py'
      - 'plugins/auto-chatter/manifest.json'
      - 'artifacts/AutoChatter-*.js'
      - 'artifacts/AutoChatter-*.zip'
      - '.github/workflows/pages.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the site and staged plugin download
        run: python3 scripts/prepare_pages.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the site and stage the current plugin download
        run: python3 scripts/prepare_pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@56afc609e74202658d3ffba0e8f6dda462b719fa # v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@983d7736d9b0ae728b81ab479565c72886d7745b # v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
